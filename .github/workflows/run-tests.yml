name: Run Tests

on:
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Image tag in GHCR'
                required: false
                type: string
                default: 'latest'
            tests:
                description: 'Tests to run'
                required: false
                type: choice
                default: 'e2e'
                options:
                    - e2e
                    - api

permissions:
    contents: read
    packages: read

jobs:
    run-test-suite:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            mongo:
                image: mongo:7
                ports: ['27017:27017']
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            BASE_URL: http://localhost:8080
            IMAGE: ghcr.io/ssgeorocks/eventsapp_express_js:${{ inputs.image_tag }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create .env for CI
              run: |
                  mkdir -p reports
                  cat > app.env <<'EOF'
                  PORT=8080
                  NODE_ENV=development
                  MONGO_URI=mongodb://localhost:27017
                  DB_NAME=jwt_test
                  COOKIE=cookietoken
                  SECRET=ci-not-a-real-secret
                  CLIENTID=ci-dummy-client-id
                  CLIENTSECRET=ci-dummy-client-secret
                  CALLBACKURL=http://localhost:8080/api/sessions/githubcallback
                  EOF

            - name: Start events application
              run: |
                  echo "Testing: $IMAGE"
                  docker pull "$IMAGE"
                  cp app.env .env
                  docker run -d --name app --network host \
                        -v "$PWD/.env:/app/.env:ro" \
                        --env-file app.env "$IMAGE"
                  sleep 5

            - name: Wait for /health to respond
              run: npx wait-on http://localhost:8080/health --timeout 60000

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'
                  cache-dependency-path: requirements.txt

            - run: pip install -r requirements.txt

            - name: Run test suite
              env:
                TESTS: ${{ inputs.tests }}
              run: python -m pytest -m "$TESTS" -v --junitxml=reports/results.xml

            - name: Log output on failure
              if: failure()
              run: |
                  docker logs app > reports/app.log 2>&1 || true
                  cat reports/app.log || true

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: suite-selfcheck
                  path: reports/
                  if-no-files-found: warn