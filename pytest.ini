[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: camino crítico, corre en cada PR
    security: autenticación y autorización
    external: depende de servicios externos (OAuth), fuera del gate
    e2e: navegador, corre local o nightly, fuera del gate
    quarantine: flaky conocido, se reporta pero no bloquea
